name: cloudflare-ranges
on:
  schedule:
    - cron: "0 3 * * 1" # weekly: Cloudflare adds ranges before using them (developers.cloudflare.com, "IP range updates")
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      # Red = firewall/cloudflare-ips.json is stale: regenerate, release, and re-stage each site's origin-lock rule.
      - run: node scripts/cloudflare-firewall.mjs --check
